<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nút Thích Công Khai</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --primary:#3b82f6; --primary-hover:#2563eb;
    --success:#10b981; --danger:#ef4444; --text:#f1f5f9; --muted:#94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg,#0f172a 0%,#1e1b4b 100%);
    color: var(--text); min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--card); border-radius: 20px; padding: 40px 30px;
    max-width: 480px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center; border: 1px solid rgba(255,255,255,0.05);
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
  .subtitle { color: var(--muted); font-size: .9rem; margin-bottom: 30px; }
  .count-box {
    background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3);
    border-radius: 16px; padding: 24px; margin-bottom: 28px;
  }
  .count-number {
    font-size: 3rem; font-weight: 800; color: var(--primary);
    line-height: 1; transition: transform .3s;
  }
  .count-number.pop { transform: scale(1.15); }
  .count-label {
    color: var(--muted); font-size: .85rem; margin-top: 8px;
    text-transform: uppercase; letter-spacing: 1px;
  }
  #likeBtn {
    width: 100%; padding: 16px 24px; font-size: 1.1rem; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer;
    background: var(--primary); color: white; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  #likeBtn:hover:not(:disabled) {
    background: var(--primary-hover); transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59,130,246,.4);
  }
  #likeBtn:disabled { cursor: not-allowed; opacity: .9; }
  #likeBtn.liked { background: var(--success); }
  .status {
    margin-top: 16px; font-size: .85rem; color: var(--muted); min-height: 20px;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--success); }
  .footer { margin-top: 24px; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>❤️ Nút Thích Công Khai</h1>
    <p class="subtitle">Mỗi người chỉ +1 duy nhất — nhấn là xong</p>
    <div class="count-box">
      <div class="count-number" id="countDisplay">0</div>
      <div class="count-label">lượt thích</div>
    </div>
    <button id="likeBtn">
      <span id="btnText">❤️ Thích (+1)</span>
    </button>
    <div class="status" id="statusMsg"></div>
    <div class="footer">Lưu cục bộ bằng LocalStorage + Cookie</div>
  </div>

<script>
const COOKIE_NAME = "liked_v1";
const LS_LIKED    = "liked_v1";
const LS_COUNT    = "like_count_v1";
const ONE_YEAR    = 365 * 24 * 60 * 60 * 1000;

/* Cookie + LocalStorage */
function setCookie(n, v, ms) {
  const e = new Date(Date.now() + ms).toUTCString();
  document.cookie = `${n}=${v}; expires=${e}; path=/; SameSite=Lax`;
}
function getCookie(n) {
  const m = document.cookie.match(new RegExp("(^|; )" + n + "=([^;]*)"));
  return m ? decodeURIComponent(m[2]) : null;
}
function isAlreadyLiked() {
  return getCookie(COOKIE_NAME) === "1" || localStorage.getItem(LS_LIKED) === "1";
}
function markLiked() {
  setCookie(COOKIE_NAME, "1", ONE_YEAR);
  try { localStorage.setItem(LS_LIKED, "1"); } catch {}
}

/* Count */
function getCount() {
  const v = parseInt(localStorage.getItem(LS_COUNT) || "0", 10);
  return isNaN(v) ? 0 : v;
}
function setCount(v) {
  try { localStorage.setItem(LS_COUNT, String(v)); } catch {}
}

/* Fingerprint đơn giản (để chống trùng mạnh hơn 1 chút) */
async function sha256(str) {
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0")).join("");
}
async function buildFingerprint() {
  const parts = [
    navigator.userAgent, navigator.language,
    screen.width + "x" + screen.height + "x" + screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency || 0,
    navigator.platform || ""
  ];
  return await sha256(parts.join("|"));
}

/* UI */
const btn = document.getElementById("likeBtn");
const btnText = document.getElementById("btnText");
const countDisplay = document.getElementById("countDisplay");
const statusMsg = document.getElementById("statusMsg");

function setStatus(msg, cls = "") {
  statusMsg.textContent = msg;
  statusMsg.className = "status " + cls;
}
function updateCountUI(val) {
  countDisplay.textContent = val;
  countDisplay.classList.add("pop");
  setTimeout(() => countDisplay.classList.remove("pop"), 300);
}
function lockButtonLiked() {
  btn.disabled = true;
  btn.classList.add("liked");
  btnText.textContent = "✓ Đã thích";
}

/* Khởi động */
(async function bootstrap() {
  updateCountUI(getCount());

  if (isAlreadyLiked()) {
    lockButtonLiked();
    setStatus("Bạn đã thích trước đó. Cảm ơn!", "ok");
    return;
  }
  setStatus("Nhấn để thích!");
})();

/* Sự kiện nhấn */
btn.addEventListener("click", async () => {
  if (isAlreadyLiked()) {
    lockButtonLiked();
    setStatus("Bạn đã thích trước đó.", "ok");
    return;
  }
  btn.disabled = true;
  btnText.textContent = "Đang ghi…";

  try {
    // Tạo fingerprint (chỉ dùng nội bộ để chống trùng cookie bị xóa)
    const fp = await buildFingerprint();
    const usedKey = "fp_used_" + fp.substring(0, 16);
    if (localStorage.getItem(usedKey) === "1") {
      markLiked();
      lockButtonLiked();
      setStatus("Thiết bị này đã thích rồi.", "ok");
      return;
    }

    const newCount = getCount() + 1;
    setCount(newCount);
    localStorage.setItem(usedKey, "1");
    markLiked();
    updateCountUI(newCount);
    lockButtonLiked();
    setStatus("Thích thành công! Cảm ơn bạn ❤️", "ok");
  } catch (e) {
    setStatus("Lỗi: " + e.message, "error");
    btn.disabled = false;
    btnText.textContent = "❤️ Thử lại";
  }
});
</script>
</body>
</html>
